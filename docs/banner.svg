      <rect x="12" y="54" width="88" height="4" rx="2" fill="#eeeae2"/>
      <rect x="12" y="54" width="24" height="4" rx="2" fill="url(#accent)"/>

      <rect x="120" y="0" width="106" height="66" rx="10" fill="#ffffff" stroke="#eeeae2"/>
