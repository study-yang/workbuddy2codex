      <g fill="url(#accent)">
        <rect x="18" y="40" width="9" height="8" rx="2"/>
        <rect x="34" y="36" width="9" height="12" rx="2"/>
        <rect x="50" y="30" width="9" height="18" rx="2"/>
        <rect x="66" y="22" width="9" height="26" rx="2"/>
        <rect x="82" y="34" width="9" height="14" rx="2"/>
        <rect x="98" y="38" width="9" height="10" rx="2"/>
        <rect x="114" y="28" width="9" height="20" rx="2"/>
        <rect x="130" y="16" width="9" height="32" rx="2"/>
        <rect x="146" y="24" width="9" height="24" rx="2"/>
        <rect x="162" y="32" width="9" height="16" rx="2"/>
        <rect x="178" y="20" width="9" height="28" rx="2"/>
        <rect x="194" y="34" width="9" height="14" rx="2"/>
        <rect x="210" y="42" width="9" height="6" rx="2"/>
        <rect x="226" y="26" width="9" height="22" rx="2"/>
        <rect x="242" y="36" width="9" height="12" rx="2"/>
