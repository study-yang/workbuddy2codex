      <rect x="0" y="0" width="44" height="44" rx="13" fill="url(#accent)"/>
      <text x="22" y="29" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">W</text>
      <text x="60" y="17" font-size="13" fill="#7c7c80" letter-spacing="1.4">LOCAL GATEWAY · MIT</text>
      <text x="60" y="37" font-size="12.5" fill="#a9a9ad" letter-spacing=".2">WorkBuddy → Codex / Claude Code</text>
    </g>

    <text x="76" y="176" font-size="52" font-weight="700" fill="#1d1d1f" letter-spacing="-1.6">WorkBuddy</text>
    <text x="76" y="176" font-size="52" font-weight="300" fill="#a9a9ad" letter-spacing="-1.6" dx="352">→</text>
    <text x="76" y="176" font-size="52" font-weight="700" letter-spacing="-1.6" dx="424" fill="url(#accent)">Codex</text>

    <text x="78" y="212" font-size="17" fill="#3a3a3c">把 WorkBuddy 的模型接进 Codex，顺手给你一本积分账。</text>
    <text x="78" y="240" font-size="14.5" fill="#7c7c80">本地运行 · 上游零改动 · 实时倍率 · 按对话归集消耗 · 一键写入 cc-switch</text>

    <g transform="translate(78,266)">
      <rect x="0" y="0" width="112" height="28" rx="14" fill="#0071e3" fill-opacity=".1"/>
      <text x="56" y="18.5" font-size="12.5" fill="#0071e3" text-anchor="middle">127.0.0.1 只本机</text>
      <rect x="122" y="0" width="96" height="28" rx="14" fill="#34c759" fill-opacity=".12"/>
      <text x="170" y="18.5" font-size="12.5" fill="#248a3d" text-anchor="middle">零依赖</text>
      <rect x="228" y="0" width="132" height="28" rx="14" fill="#af52de" fill-opacity=".1"/>
      <text x="294" y="18.5" font-size="12.5" fill="#8e44c8" text-anchor="middle">Python 3.10+</text>
    </g>
  </g>

  <!-- 右侧面板示意 -->
