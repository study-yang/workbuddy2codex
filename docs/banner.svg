      <rect x="0" y="0" width="334" height="46" rx="10" fill="#ffffff" stroke="#eeeae2"/>
      <circle cx="20" cy="16" r="6" fill="#ffd08a"/>
      <text x="34" y="20" font-size="10" fill="#1d1d1f">六只羊</text>
      <rect x="88" y="11" width="34" height="11" rx="5.5" fill="#34c759" fill-opacity=".15"/>
      <text x="105" y="19.5" font-size="8" fill="#248a3d" text-anchor="middle">可用</text>
      <text x="140" y="20" font-size="10" fill="#7c7c80">deepseek-v4.1-flash</text>
      <text x="316" y="20" font-size="10" fill="#1d1d1f" text-anchor="end">x0.11</text>
