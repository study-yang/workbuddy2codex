<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="WorkBuddy to Codex 本地网关控制台">
  <defs>
    <radialGradient id="g1" cx="12%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="88%" cy="6%" r="55%">
      <stop offset="0%" stop-color="#af52de" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#af52de" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="52%" cy="108%" r="55%">
