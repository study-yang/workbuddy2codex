  <rect width="1280" height="320" fill="url(#g2)"/>
  <rect width="1280" height="320" fill="url(#g3)"/>

  <!-- 左侧文字 -->
  <g font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
